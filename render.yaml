services:
  - type: web
    runtime: python
    name: nurux-api
    plan: free
    rootDir: backend
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /api/health/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nurux-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: nurux-api.onrender.com,.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://nurux-web.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://nurux-web.onrender.com
      - key: GEMINI_API_KEY
        sync: false

  - type: web
    runtime: static
    name: nurux-web
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://nurux-api.onrender.com/api
      - key: VITE_APK_DOWNLOAD_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin

databases:
  - name: nurux-db
    plan: free
    databaseName: nurux
    user: nurux_user
